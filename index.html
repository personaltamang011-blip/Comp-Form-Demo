<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Parts Entry</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#74ebd5,#ACB6E5)}
.form-container{background:#fff;padding:30px 40px;border-radius:15px;box-shadow:0 4px 20px rgba(0,0,0,0.15);width:100%;max-width:420px}
.form-container h2{text-align:center;margin-bottom:20px}
.form-group{position:relative;margin-bottom:20px}
.form-group input,.form-group select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;background:transparent}
.form-group label{position:absolute;top:50%;left:12px;transform:translateY(-50%);color:#666;font-size:16px;pointer-events:none;transition:0.3s;background:#fff;padding:0 5px}
.form-group input:focus + label,
.form-group input:not(:placeholder-shown) + label,
.form-group select:focus + label,
.form-group select:not([value=""]) + label{
top:0;font-size:13px;color:#149b63
}
button{width:100%;padding:12px;background:#585f66;color:#fff;border:none;border-radius:8px;cursor:pointer}
button:hover{background:#248363}
</style>
</head>

<body>

<div class="form-container">
<h2>Computer Parts Entry</h2>

<form name="contact-form">

<div class="form-group">
<input type="text" name="date" placeholder=" ">
<label>Date (Nepali)</label>
</div>

<div class="form-group">
<select name="mainCategory" id="mainCategory" required></select>
<label>Main Category</label>
</div>

<div class="form-group">
<select name="secondaryCategory" id="secondaryCategory" required></select>
<label>Secondary Category</label>
</div>

<div class="form-group">
<select name="thirdCategory" id="thirdCategory" required></select>
<label>Third Category</label>
</div>

<div class="form-group">
<select name="item" id="itemSelect" required></select>
<label>Items</label>
</div>

<div class="form-group">
<input type="number" name="quantity" placeholder=" " required>
<label>Quantity</label>
</div>

<div class="form-group">
<input type="number" name="price" id="priceInput" placeholder=" " required>
<label>Price</label>
</div>

<button type="submit">Submit</button>
</form>

</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxjoTZMaxtqgITeTnktuODWfUFXgchfytszx2x19PhKkhA21IuRyKfFk2Pd_UZ6hb_c/exec";

const jsonFile = "data.computer.json";
let data = {};

const mainCat = document.getElementById("mainCategory");
const subCat = document.getElementById("secondaryCategory");
const thirdCat = document.getElementById("thirdCategory");
const itemSel = document.getElementById("itemSelect");
const priceInput = document.getElementById("priceInput");

// LOAD JSON
async function loadData(){
  try{
    const res = await fetch(jsonFile);
    data = await res.json();

    mainCat.innerHTML = `<option value="" disabled selected>Select</option>`;
    Object.keys(data).forEach(key=>{
      mainCat.innerHTML += `<option value="${key}">${key}</option>`;
    });

  }catch(err){
    alert("❌ JSON not loading. Check file path.");
    console.error(err);
  }
}
loadData();

// MAIN → SECONDARY
mainCat.onchange = ()=>{
  subCat.innerHTML = `<option value="" disabled selected>Select</option>`;
  thirdCat.innerHTML = `<option value="" disabled selected>Select</option>`;
  itemSel.innerHTML = `<option value="" disabled selected>Select</option>`;
  priceInput.value = "";

  Object.keys(data[mainCat.value]).forEach(key=>{
    subCat.innerHTML += `<option value="${key}">${key}</option>`;
  });
};

// SECONDARY → THIRD
subCat.onchange = ()=>{
  thirdCat.innerHTML = `<option value="" disabled selected>Select</option>`;
  itemSel.innerHTML = `<option value="" disabled selected>Select</option>`;
  priceInput.value = "";

  Object.keys(data[mainCat.value][subCat.value]).forEach(key=>{
    thirdCat.innerHTML += `<option value="${key}">${key}</option>`;
  });
};

// THIRD → ITEMS
thirdCat.onchange = ()=>{
  itemSel.innerHTML = `<option value="" disabled selected>Select</option>`;
  priceInput.value = "";

  data[mainCat.value][subCat.value][thirdCat.value].forEach(obj=>{
    itemSel.innerHTML += `
      <option value="${obj.item}" data-price="${obj.price}">
        ${obj.item}
      </option>`;
  });
};

// ITEM → PRICE AUTO
itemSel.onchange = ()=>{
  const selected = itemSel.options[itemSel.selectedIndex];
  priceInput.value = selected.dataset.price || "";
};

// SUBMIT
const form = document.forms['contact-form'];

form.addEventListener("submit", e=>{
  e.preventDefault();

  fetch(scriptURL,{
    method:"POST",
    body:new FormData(form)
  })
  .then(()=>{
    alert("✅ Submitted Successfully");
    form.reset();
    priceInput.value = "";
  })
  .catch(err=>{
    alert("❌ Submission Failed");
    console.error(err);
  });
});
</script>

</body>
</html>
